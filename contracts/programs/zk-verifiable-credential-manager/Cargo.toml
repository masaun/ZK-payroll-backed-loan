[package]
name = "zk-verifiable-credential-manager"
version = "0.1.0"
description = "ZK-TLS Proof and Public Output Storage Manager"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "zk_verifiable_credential_manager"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.32.1", features = ["init-if-needed"] }
anchor-spl = "0.32.1"
